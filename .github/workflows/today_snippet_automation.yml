name: Today's Snippet - Shift Brief (12h)

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC (Adjust if you prefer specific IST times)
    - cron: '0 0,12 * * *'
  workflow_dispatch: 

jobs:
  update_daily_intel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai feedparser beautifulsoup4

    - name: Run Today's Snippet Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python live_pipeline_today.py || echo "Today pipeline failed."

    - name: Commit and Push
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git pull origin main --rebase || echo "No changes to pull"
        git add data/today_snippet/
        git commit -m "📋 Auto-Update: Today's Snippet 12H Brief" || echo "No changes to commit"
        git push

    # --- KOYEB AUTO-DEPLOY TRIGGER (DIRECT API) ---
    - name: Trigger Koyeb Redeploy
      run: |
        curl -X POST "https://app.koyeb.com/v1/services/83c34b02-6b6a-41fb-81c5-7543947250b4/redeploy" \
        -H "Authorization: Bearer ${{ secrets.KOYEB_API_TOKEN }}" \
        -H "Content-Type: application/json"