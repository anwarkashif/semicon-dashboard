name: Generate SemicoN Weekly Brief

on:
  schedule:
    # 1. The Main Loop (Every 2 hours - includes 5:30 AM IST)
    - cron: '0 */2 * * *'
    # 2. Fallback Window 1: Fridays at 00:30 UTC (6:00 AM IST)
    - cron: '30 0 * * 5'
    # 3. Fallback Window 2: Fridays at 01:00 UTC (6:30 AM IST)
    - cron: '0 1 * * 5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai plotly feedparser

    - name: Run fetch_brief.py
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NEWS_API_KEY_1: ${{ secrets.NEWS_API_KEY }}
        NEWS_API_KEY_2: ${{ secrets.NEWS_API_KEY_2 }}
        NEWS_API_KEY_3: ${{ secrets.NEWS_API_KEY_3 }}
        NEWS_API_KEY_4: ${{ secrets.NEWS_API_KEY_4 }}
      run: python fetch_brief.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git pull origin main --rebase || echo "No changes to pull"
        git add --all data/
        git commit -m "🤖 Auto-Update: SemicoN Data updated" || echo "No changes to commit"
        git push
