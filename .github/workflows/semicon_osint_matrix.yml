name: SemicoN Geopolitics-OSINT Switchboard Engine

on:
  repository_dispatch:
    types:
      - trigger_executive_radar
      - trigger_weekly_brief
      - trigger_memory_layer
      - trigger_shift_brief
      - trigger_psyopoly_siphon  # 🚀 Added to Master Dispatcher List

jobs:
  osint-pipeline-dispatcher:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ==========================================
    # TASK 1: EXECUTIVE HOME - LIVE RADAR (45M)
    # ==========================================
    - name: Set up Python 3.10 (Executive Radar)
      if: github.event.action == 'trigger_executive_radar'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Executive Radar)
      if: github.event.action == 'trigger_executive_radar'
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai feedparser

    - name: Run Executive Home Pipeline
      if: github.event.action == 'trigger_executive_radar'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python live_pipeline_executive.py || echo "Executive pipeline failed."

    - name: Commit and Push (Executive Radar)
      if: github.event.action == 'trigger_executive_radar'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git pull origin main --rebase || echo "No changes to pull"
        git add data/executive_home/
        git commit -m "🚨 Auto-Update: Executive Home Live Radar" || echo "No changes to commit"
        git push

    # ==========================================
    # TASK 2: GENERATE SEMICON WEEKLY BRIEF
    # ==========================================
    - name: Set up Python 3.10 (Weekly Brief)
      if: github.event.action == 'trigger_weekly_brief'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Weekly Brief)
      if: github.event.action == 'trigger_weekly_brief'
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai plotly feedparser beautifulsoup4

    - name: Run Core Datasets and Weekly Pipelines
      if: github.event.action == 'trigger_weekly_brief'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NEWS_API_KEY_1: ${{ secrets.NEWS_API_KEY }}
        NEWS_API_KEY_2: ${{ secrets.NEWS_API_KEY_2 }}
        NEWS_API_KEY_3: ${{ secrets.NEWS_API_KEY_3 }}
        NEWS_API_KEY_4: ${{ secrets.NEWS_API_KEY_4 }}
      run: |
        python fetch_brief.py
        python live_pipeline_executive.py || echo "Executive pipeline failed, skipping."
        python live_pipeline_weekly_tactical.py || echo "Tactical pipeline failed, skipping."
        python generate_weekly_tactical.py || echo "Tactical generator failed, skipping."
        python generate_outlook.py || echo "Strategic Outlook generator not found, skipping."

    - name: Commit and Push (Weekly Brief)
      if: github.event.action == 'trigger_weekly_brief'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git pull origin main --rebase || echo "No changes to pull"
        git add --all data/
        git commit -m "🤖 Auto-Update: SemicoN Data updated" || echo "No changes to commit"
        git push

    # ==========================================
    # TASK 3: GEOPOLITICAL MEMORY LAYER
    # ==========================================
    - name: Set Up Python 3.11 (Memory Layer)
      if: github.event.action == 'trigger_memory_layer'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies (Memory Layer)
      if: github.event.action == 'trigger_memory_layer'
      run: pip install pandas

    - name: Run Memory Engine
      if: github.event.action == 'trigger_memory_layer'
      run: |
        DAY=$(date +%d | sed 's/^0//')
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { [ $DAY -ge 8 ] && [ $DAY -le 14 ]; } || { [ $DAY -ge 22 ] && [ $DAY -le 28 ]; }; then
          python generate_memory_layer.py
        else
          echo "Not the 2nd or 4th Friday. Gracefully skipping generation pass."
        fi

    - name: Commit Updated Memory File
      if: github.event.action == 'trigger_memory_layer'
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add data/geopolitical_memory.json
        git commit -m "Update Geopolitical Memory Layer" || echo "No changes"
        git push

    # ==========================================
    # TASK 4: TODAY'S SNIPPET - SHIFT BRIEF (12H)
    # ==========================================
    - name: Set up Python 3.10 (Shift Brief)
      if: github.event.action == 'trigger_shift_brief'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Shift Brief)
      if: github.event.action == 'trigger_shift_brief'
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai feedparser beautifulsoup4

    - name: Run Today's Snippet Pipeline
      if: github.event.action == 'trigger_shift_brief'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python live_pipeline_today.py || echo "Today pipeline failed."

    - name: Commit and Push (Shift Brief)
      if: github.event.action == 'trigger_shift_brief'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git pull origin main --rebase || echo "No changes to pull"
        git add data/today_snippet/
        git commit -m "📋 Auto-Update: Today's Snippet 12H Brief" || echo "No changes to commit"
        git push

    # ==========================================
    # TASK 5: WEST ASIA STRATEGIC INTEL - PSYOPOLY SIPHON (HOURLY)
    # ==========================================
    - name: Set up Python 3.10 (Psyopoly Siphon)
      if: github.event.action == 'trigger_psyopoly_siphon'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Psyopoly Siphon)
      if: github.event.action == 'trigger_psyopoly_siphon'
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Psyopoly Extractor Pipeline
      if: github.event.action == 'trigger_psyopoly_siphon'
      run: python psyopoly_extractor.py || echo "Psyopoly pipeline failed."

    - name: Commit and Push (Psyopoly Siphon)
      if: github.event.action == 'trigger_psyopoly_siphon'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git pull origin main --rebase || echo "No changes to pull"
        git add data/tactical_events_24h.json
        git commit -m "🚨 Auto-Update: West Asia Psyopoly Intel" || echo "No changes to commit"
        git push