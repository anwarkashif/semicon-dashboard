name: SemicoN Geopolitics-OSINT Switchboard Engine

on:
  repository_dispatch:
    types:
      - trigger_executive_radar
      - trigger_weekly_brief
      - trigger_memory_layer
      - trigger_shift_brief
      - trigger_psyopoly_siphon
      - trigger_flash_alert
      - trigger_west_asia_weekly
      - trigger_agentic_ai

jobs:
  osint-pipeline-dispatcher:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    concurrency:
      group: semicon-pipeline-${{ github.event.action }}
      cancel-in-progress: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ==========================================
    # TASK 1: EXECUTIVE HOME - LIVE RADAR (45M)
    # ==========================================
    - name: Set up Python 3.10 (Executive Radar)
      if: github.event.action == 'trigger_executive_radar'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Executive Radar)
      if: github.event.action == 'trigger_executive_radar'
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai feedparser beautifulsoup4 huggingface-hub trafilatura langgraph

    - name: Run Executive Home Pipeline
      if: github.event.action == 'trigger_executive_radar'
      env:
        GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
        RAG_GEMINI_API_KEY: ${{ secrets.RAG_GEMINI_API_KEY }}
        RAG_GEMINI_API_KEY_2: ${{ secrets.RAG_GEMINI_API_KEY_2 }}
        RAG_GEMINI_API_KEY_3: ${{ secrets.RAG_GEMINI_API_KEY_3 }}
        RAG_GEMINI_API_KEY_4: ${{ secrets.RAG_GEMINI_API_KEY_4 }}
        RAG_GEMINI_API_KEY_5: ${{ secrets.RAG_GEMINI_API_KEY_5 }}
      run: python live_pipeline_executive.py

    - name: Push Live Radar Autonomous Intel Alert
      if: github.event.action == 'trigger_executive_radar'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: 587
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "🚨 [SemicoN Live Radar Alert] New Strategic Intel Cycle Completed"
        to: anwarkashif@outlook.com
        from: "SemicoN Switchboard Engine <${{ secrets.SMTP_USERNAME }}>"
        body: "The 5-Node Cyclical Execution Graph has completed processing for Task 1: Executive Home Live Radar. The intelligence payload has been securely synced to your workspace environment."
        convert_markdown: true

    - name: Sync Data Directly to 8.8 TB Bucket
      if: github.event.action == 'trigger_executive_radar'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        curl -LsSf https://hf.co/cli/install.sh | bash
        /home/runner/.local/bin/hf sync ./data hf://buckets/kashifanwar/semicon-dashboard-storage

    # ==========================================
    # TASK 2: GENERATE SEMICON WEEKLY BRIEF
    # ==========================================
    - name: Set up Python 3.10 (Weekly Brief)
      if: github.event.action == 'trigger_weekly_brief'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Weekly Brief)
      if: github.event.action == 'trigger_weekly_brief'
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai plotly feedparser beautifulsoup4 huggingface-hub trafilatura langgraph

    - name: Run Core Datasets and Weekly Pipelines
      if: github.event.action == 'trigger_weekly_brief'
      env:
        GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
        RAG_GEMINI_API_KEY: ${{ secrets.RAG_GEMINI_API_KEY }}
        RAG_GEMINI_API_KEY_2: ${{ secrets.RAG_GEMINI_API_KEY_2 }}
        RAG_GEMINI_API_KEY_3: ${{ secrets.RAG_GEMINI_API_KEY_3 }}
        RAG_GEMINI_API_KEY_4: ${{ secrets.RAG_GEMINI_API_KEY_4 }}
        RAG_GEMINI_API_KEY_5: ${{ secrets.RAG_GEMINI_API_KEY_5 }}
        NEWS_API_KEY_1: ${{ secrets.NEWS_API_KEY }}
        NEWS_API_KEY_2: ${{ secrets.NEWS_API_KEY_2 }}
        NEWS_API_KEY_3: ${{ secrets.NEWS_API_KEY_3 }}
        NEWS_API_KEY_4: ${{ secrets.NEWS_API_KEY_4 }}
      run: |
        python fetch_brief.py
        python live_pipeline_executive.py
        python live_pipeline_weekly_tactical.py
        python generate_weekly_tactical.py
        python generate_outlook.py || echo "Strategic Outlook generator not found, skipping gracefully."

    - name: Sync Data Directly to 8.8 TB Bucket
      if: github.event.action == 'trigger_weekly_brief'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        curl -LsSf https://hf.co/cli/install.sh | bash
        /home/runner/.local/bin/hf sync ./data hf://buckets/kashifanwar/semicon-dashboard-storage

    # ==========================================
    # TASK 3: GEOPOLITICAL MEMORY LAYER
    # ==========================================
    - name: Set Up Python 3.11 (Memory Layer)
      if: github.event.action == 'trigger_memory_layer'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies (Memory Layer)
      if: github.event.action == 'trigger_memory_layer'
      run: pip install pandas huggingface-hub

    - name: Run Memory Engine
      if: github.event.action == 'trigger_memory_layer'
      env:
        GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
      run: |
        DAY=$(date +%d | sed 's/^0//')
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { [ $DAY -ge 8 ] && [ $DAY -le 14 ]; } || { [ $DAY -ge 22 ] && [ $DAY -le 28 ]; }; then
          python generate_memory_layer.py
        else
          echo "Not the 2nd or 4th Friday. Gracefully skipping generation pass."
        fi

    - name: Sync Data Directly to 8.8 TB Bucket
      if: github.event.action == 'trigger_memory_layer'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        curl -LsSf https://hf.co/cli/install.sh | bash
        /home/runner/.local/bin/hf sync ./data hf://buckets/kashifanwar/semicon-dashboard-storage

    # ==========================================
    # TASK 4: TODAY'S SNIPPET - SHIFT BRIEF (12H)
    # ==========================================
    - name: Set up Python 3.10 (Shift Brief)
      if: github.event.action == 'trigger_shift_brief'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Shift Brief)
      if: github.event.action == 'trigger_shift_brief'
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai feedparser beautifulsoup4 huggingface-hub trafilatura langgraph

    - name: Run Today's Snippet Pipeline
      if: github.event.action == 'trigger_shift_brief'
      env:
        GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
        RAG_GEMINI_API_KEY: ${{ secrets.RAG_GEMINI_API_KEY }}
        RAG_GEMINI_API_KEY_2: ${{ secrets.RAG_GEMINI_API_KEY_2 }}
        RAG_GEMINI_API_KEY_3: ${{ secrets.RAG_GEMINI_API_KEY_3 }}
        RAG_GEMINI_API_KEY_4: ${{ secrets.RAG_GEMINI_API_KEY_4 }}
        RAG_GEMINI_API_KEY_5: ${{ secrets.RAG_GEMINI_API_KEY_5 }}
      run: python live_pipeline_today.py

    - name: Push Shift Brief Autonomous Intel Alert
      if: github.event.action == 'trigger_shift_brief'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: 587
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "📋 [SemicoN Shift Brief] 12H Autonomous Intel Digest Generated"
        to: anwarkashif@outlook.com
        from: "SemicoN Switchboard Engine <${{ secrets.SMTP_USERNAME }}>"
        body: "The 12-hour cyclical execution pass has successfully completed. Your contextual strategic briefing updates have been dispatched to your primary monitoring profile."
        convert_markdown: true

    - name: Sync Data Directly to 8.8 TB Bucket
      if: github.event.action == 'trigger_shift_brief'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        curl -LsSf https://hf.co/cli/install.sh | bash
        /home/runner/.local/bin/hf sync ./data hf://buckets/kashifanwar/semicon-dashboard-storage

    # ==========================================
    # TASK 5: WEST ASIA STRATEGIC INTEL - PSYOPOLY SIPHON (HOURLY)
    # ==========================================
    - name: Set up Python 3.10 (Psyopoly Siphon)
      if: github.event.action == 'trigger_psyopoly_siphon'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Psyopoly Siphon)
      if: github.event.action == 'trigger_psyopoly_siphon'
      run: |
        python -m pip install --upgrade pip
        pip install requests huggingface-hub trafilatura langgraph

    - name: Run Psyopoly Extractor Pipeline
      if: github.event.action == 'trigger_psyopoly_siphon'
      env:
        GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
      run: python psyopoly_extractor.py

    - name: Push West Asia Siphon Autonomous Intel Alert
      if: github.event.action == 'trigger_psyopoly_siphon'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: 587
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "🌍 [SemicoN West Asia Siphon] Hourly Strategic Processing Verified"
        to: anwarkashif@outlook.com
        from: "SemicoN Switchboard Engine <${{ secrets.SMTP_USERNAME }}>"
        body: "Hourly extraction runs for West Asia OSINT target streams completed smoothly. Data structures updated cleanly inside the central repository."
        convert_markdown: true

    - name: Sync Data Directly to 8.8 TB Bucket
      if: github.event.action == 'trigger_psyopoly_siphon'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        curl -LsSf https://hf.co/cli/install.sh | bash
        /home/runner/.local/bin/hf sync ./data hf://buckets/kashifanwar/semicon-dashboard-storage

    # ==========================================
    # TASK 6: FLASH ALERT INTEGRATION PIPELINE
    # ==========================================
    - name: Set up Python 3.10 (Flash Alert)
      if: github.event.action == 'trigger_flash_alert'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Flash Alert)
      if: github.event.action == 'trigger_flash_alert'
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai feedparser beautifulsoup4 huggingface-hub trafilatura langgraph

    - name: Run Flash Alert Engine
      if: github.event.action == 'trigger_flash_alert'
      env:
        GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
        RAG_GEMINI_API_KEY: ${{ secrets.RAG_GEMINI_API_KEY }}
        RAG_GEMINI_API_KEY_2: ${{ secrets.RAG_GEMINI_API_KEY_2 }}
        RAG_GEMINI_API_KEY_3: ${{ secrets.RAG_GEMINI_API_KEY_3 }}
        RAG_GEMINI_API_KEY_4: ${{ secrets.RAG_GEMINI_API_KEY_4 }}
        RAG_GEMINI_API_KEY_5: ${{ secrets.RAG_GEMINI_API_KEY_5 }}
      run: python live_pipeline_flash.py

    - name: Push Flash Alert Autonomous Notification
      if: github.event.action == 'trigger_flash_alert'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: 587
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "⚡ [SemicoN FLASH ALERT] Critical Geopolitical Shock Trigger Event"
        to: anwarkashif@outlook.com
        from: "SemicoN Switchboard Engine <${{ secrets.SMTP_USERNAME }}>"
        body: "CRITICAL: The Flash Alert Integration Engine detected high-priority metrics breaking baseline thresholds. Review your active dashboard platform immediately."
        convert_markdown: true

    - name: Sync Data Directly to 8.8 TB Bucket
      if: github.event.action == 'trigger_flash_alert'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        curl -LsSf https://hf.co/cli/install.sh | bash
        /home/runner/.local/bin/hf sync ./data hf://buckets/kashifanwar/semicon-dashboard-storage

    # ==========================================
    # TASK 7: WEEKLY WEST ASIA BRIEF (PSYOPOLY)
    # ==========================================
    - name: Set up Python 3.10 (West Asia Weekly)
      if: github.event.action == 'trigger_west_asia_weekly'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (West Asia Weekly)
      if: github.event.action == 'trigger_west_asia_weekly'
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai huggingface-hub trafilatura langgraph

    - name: Run West Asia Weekly Pipeline
      if: github.event.action == 'trigger_west_asia_weekly'
      env:
        GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
        RAG_GEMINI_API_KEY: ${{ secrets.RAG_GEMINI_API_KEY }}
        RAG_GEMINI_API_KEY_2: ${{ secrets.RAG_GEMINI_API_KEY_2 }}
        RAG_GEMINI_API_KEY_3: ${{ secrets.RAG_GEMINI_API_KEY_3 }}
        RAG_GEMINI_API_KEY_4: ${{ secrets.RAG_GEMINI_API_KEY_4 }}
        RAG_GEMINI_API_KEY_5: ${{ secrets.RAG_GEMINI_API_KEY_5 }}
      run: python live_pipeline_west_asia_weekly.py

    - name: Sync Data Directly to 8.8 TB Bucket
      if: github.event.action == 'trigger_west_asia_weekly'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        curl -LsSf https://hf.co/cli/install.sh | bash
        /home/runner/.local/bin/hf sync ./data hf://buckets/kashifanwar/semicon-dashboard-storage

    # ==========================================
    # TASK 8: AUTONOMOUS AGENTIC AI LOOP (25M)
    # ==========================================
    - name: Set up Python 3.10 (Agentic AI)
      if: github.event.action == 'trigger_agentic_ai'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies (Agentic AI)
      if: github.event.action == 'trigger_agentic_ai'
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai feedparser beautifulsoup4 huggingface-hub trafilatura langgraph streamlit

    - name: Run Agentic AI Engine
      if: github.event.action == 'trigger_agentic_ai'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY_RAGAI: ${{ secrets.GEMINI_API_KEY_RAGAI }}
      run: python agent_graph.py

    - name: Push Agentic AI News via Email
      if: github.event.action == 'trigger_agentic_ai'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: 587
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "🤖 [SemicoN Agentic AI] Autonomous Intelligence Brief"
        to: anwarkashif@outlook.com
        from: "SemicoN Switchboard Engine <${{ secrets.SMTP_USERNAME }}>"
        body: file://data/agentic_email_body.md
        convert_markdown: true

    - name: Sync Data Directly to 8.8 TB Bucket
      if: github.event.action == 'trigger_agentic_ai'
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        curl -LsSf https://hf.co/cli/install.sh | bash
        /home/runner/.local/bin/hf sync ./data hf://buckets/kashifanwar/semicon-dashboard-storage