name: SemicoN Psyopoly Siphon

on:
  repository_dispatch:
    types: [trigger_psyopoly_siphon]

jobs:
  extract_psyopoly:
    runs-on: ubuntu-latest
    
    # 🚀 FIX FOR ERROR 128: Grants GitHub Actions permission to push code
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        ref: main # 🚀 FIX FOR ERROR 128: Ensures we are not on a detached HEAD

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Psyopoly Extractor
      run: python psyopoly_extractor.py

    - name: Commit and Push Updated Intel
      run: |
        git config --global user.name "SemicoN Automaton"
        git config --global user.email "automaton@semicon.local"
        git add data/tactical_events_24h.json
        git commit -m "Automated Psyopoly Intel Update" || echo "No new intel to commit"
        git push origin main