[theme]
base="dark"
primaryColor="#d81b60"
backgroundColor="#0e1117"
secondaryBackgroundColor="#1e1e1e"
textColor="#fafafa"
font="sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[client]
toolbarMode = "minimal"
showErrorDetails = false